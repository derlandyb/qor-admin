name: admin-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (includes unused-export/no-unused-vars — ARCHITECTURE §8.4)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit + integration tests with coverage gate (min 80% — ARCHITECTURE §8.3)
        run: npm run test:coverage

      - name: Build
        run: npm run build
